name: auto-forge-m1
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auto_forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local first}
      POSTGRES_DB: auto_forge
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - auto-forge-pg:/var/lib/postgresql/data
      - ./db/init-test.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto_forge -d auto_forge"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  auto-forge-pg:
