name: Verify M1 foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auto_forge
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: auto_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auto_forge -d auto_forge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://auto_forge:ci-test-password@127.0.0.1:5432/auto_forge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify
